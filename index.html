<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pokémon Z · Nuzlocke Tracker</title>
  <meta name="description" content="Seguimiento del Nuzlocke compartido de Pokémon Z: qué captura cada uno en cada ruta, en tiempo real." />
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="pokeball"></span>
      <span>Pokémon&nbsp;Z <small id="runName">Nuzlocke Tracker</small></span>
    </div>
    <div id="userInfo" class="run-info hidden">
      <button class="me-chip small" id="userChip" title="Editar perfil"></button>
      <button class="btn ghost" id="logoutBtn" title="Cerrar sesión">Salir</button>
    </div>
  </header>

  <main class="wrap">
    <!-- ───────── Login / registro ───────── -->
    <section id="auth" class="gate hidden">
      <div class="card auth-card">
        <h2 id="authTitle">Iniciar sesión</h2>
        <p class="muted" id="authSub">Entra con tu usuario y contraseña.</p>
        <label>Usuario<input id="authUser" placeholder="tu_usuario" maxlength="20" autocomplete="username" /></label>
        <label>Contraseña<input id="authPass" type="password" placeholder="••••••" autocomplete="current-password" /></label>
        <label id="colorField" class="hidden">Tu color
          <input id="authColor" type="color" value="#ef4444" />
        </label>
        <button class="btn primary" id="authSubmit">Entrar</button>
        <p class="muted switch">
          <span id="switchText">¿No tienes cuenta?</span>
          <a href="#" id="switchMode">Crear una</a>
        </p>
      </div>
    </section>

    <!-- ───────── App principal ───────── -->
    <section id="app" class="hidden">
      <!-- Tabla de rutas -->
      <h2 class="section-title">🗺️ Capturas por ruta</h2>
      <div class="routes-wrap">
        <table class="routes" id="routesTable"></table>
      </div>

      <!-- Tu seguimiento -->
      <h2 class="section-title">🎒 Tu seguimiento</h2>
      <div class="me-bar">
        <span class="me-chip" id="meChip"></span>
        <div class="badges">
          <span>Medallas</span>
          <button class="btn ghost round" id="badgeMinus">−</button>
          <strong id="badgeCount">0</strong><span class="muted">/12</span>
          <button class="btn ghost round" id="badgePlus">+</button>
        </div>
        <button class="btn primary" id="addBtn">+ Registrar Pokémon</button>
      </div>
      <div class="columns" id="myColumns">
        <div class="col" data-status="team"><h3>⚔️ Equipo <span class="count" id="cnt-team">0</span></h3><div class="list" id="list-team"></div></div>
        <div class="col" data-status="box"><h3>📦 Caja <span class="count" id="cnt-box">0</span></h3><div class="list" id="list-box"></div></div>
        <div class="col grave" data-status="dead"><h3>⚰️ Cementerio <span class="count" id="cnt-dead">0</span></h3><div class="list" id="list-dead"></div></div>
      </div>

      <!-- Stats por jugador -->
      <h2 class="section-title">👥 Jugadores</h2>
      <div class="friends" id="friends"></div>
    </section>
  </main>

  <!-- ───────── Modal registrar/editar Pokémon ───────── -->
  <dialog id="entryDialog">
    <form method="dialog" id="entryForm">
      <h3 id="entryTitle">Registrar Pokémon</h3>
      <label>Pokémon
        <input id="fPokemon" list="pokeList" placeholder="Busca por nombre…" autocomplete="off" required />
        <datalist id="pokeList"></datalist>
      </label>
      <div class="preview" id="pokePreview"></div>
      <label>Mote<input id="fNickname" placeholder="Opcional" maxlength="20" /></label>
      <div class="row2">
        <label>Zona de captura<input id="fLocation" list="locList" placeholder="Ruta, ciudad…" />
          <datalist id="locList"></datalist>
        </label>
        <label>Nivel<input id="fLevel" type="number" min="1" max="100" placeholder="Lv" /></label>
      </div>
      <label>Estado
        <select id="fStatus">
          <option value="team">⚔️ En el equipo</option>
          <option value="box">📦 En la caja</option>
          <option value="dead">⚰️ Muerto</option>
        </select>
      </label>
      <label>Notas<textarea id="fNotes" rows="2" maxlength="200" placeholder="Opcional"></textarea></label>
      <input type="hidden" id="fId" />
      <menu>
        <button type="button" class="btn danger left hidden" id="deleteBtn">Borrar</button>
        <button type="button" class="btn ghost" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn primary">Guardar</button>
      </menu>
    </form>
  </dialog>

  <!-- ───────── Modal perfil ───────── -->
  <dialog id="profileDialog">
    <form method="dialog" id="profileForm">
      <h3>Tu perfil</h3>
      <label>Nombre visible<input id="pName" maxlength="20" /></label>
      <div class="row2">
        <label>Color<input id="pColor" type="color" /></label>
        <label>Avatar (Pokémon)
          <input id="pAvatar" list="pokeList" placeholder="Busca un Pokémon…" autocomplete="off" />
        </label>
      </div>
      <div class="preview" id="avatarPreview"></div>
      <menu>
        <button type="button" class="btn ghost left" id="pClear">Sin avatar</button>
        <button type="button" class="btn ghost" id="pCancel">Cancelar</button>
        <button type="submit" class="btn primary">Guardar</button>
      </menu>
    </form>
  </dialog>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
